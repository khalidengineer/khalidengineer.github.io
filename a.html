<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMB - 43" TV Screen</title>
    <link rel="shortcut icon" href="assets/images/header/favicon.svg" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            cursor: none; /* Clean TV Kiosk without cursor */
        }

        /* 100% Fullscreen Viewport */
        .dmb-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Slide Container */
        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            pointer-events: none;
        }

        .slide-item.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

        /* Edge-to-Edge Pure Content Image */
        .slide-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Perfect 16:9 43" TV scale without distortion */
            object-position: center;
            display: block;
        }

        /* Minimal Silent Loader */
        .initial-loader {
            position: absolute;
            inset: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ff5722;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="dmb-screen" id="dmbScreen">
        <!-- Initial Loader -->
        <div class="initial-loader" id="initialLoader">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        (function () {
            'use strict';

            const SHEET_ID = '15hQV9i8Ysgqm42zIQ79olqHTqWKFzAFyKM-BIQMedy8';
            const SLIDE_INTERVAL_MS = 10000; // 10 seconds per slide if multiple images
            const SHEET_SYNC_MS = 30000;     // Auto-check Google Sheet every 30 seconds

            let items = [];
            let currentIndex = 0;
            let slideTimer = null;
            let wakeLock = null;
            const container = document.getElementById('dmbScreen');
            const loader = document.getElementById('initialLoader');

            /* ==========================================================
               1. Auto-Fullscreen & Keep Screen Awake for TV
               ========================================================== */
            function requestTvFullscreen() {
                const docEl = document.documentElement;
                const reqFs = docEl.requestFullscreen || 
                              docEl.webkitRequestFullscreen || 
                              docEl.mozRequestFullScreen || 
                              docEl.msRequestFullscreen;

                if (!document.fullscreenElement && !document.webkitFullscreenElement && reqFs) {
                    reqFs.call(docEl).catch(err => {
                        // Browsers may require user gesture on first load
                        console.log('Fullscreen pending user interaction:', err);
                    });
                }
            }

            // Keep screen awake (Prevents TV from going to sleep / dimming)
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log('WakeLock error:', err);
                }
            }

            // Attempt on page load
            window.addEventListener('load', () => {
                requestTvFullscreen();
                requestWakeLock();
            });

            // Automatically trigger fullscreen on the very first touch / click / remote press anywhere
            const userInteractionEvents = ['click', 'touchstart', 'keydown', 'mousedown'];
            function onFirstUserInteraction() {
                requestTvFullscreen();
                requestWakeLock();
            }

            userInteractionEvents.forEach(evt => {
                window.addEventListener(evt, onFirstUserInteraction, { passive: true });
            });

            // Re-acquire WakeLock if tab becomes visible again
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });

            /* ==========================================================
               2. Multi-Tier Google Drive URL Converter
               ========================================================== */
            function extractDriveId(url) {
                if (!url) return null;
                const fileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
                if (fileMatch && fileMatch[1]) return fileMatch[1];

                const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
                if (idMatch && idMatch[1]) return idMatch[1];

                const lh3Match = url.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/i);
                if (lh3Match && lh3Match[1]) return lh3Match[1];

                return null;
            }

            function getDriveImageUrls(driveId) {
                return [
                    `https://drive.google.com/thumbnail?id=${driveId}&sz=w2560`,
                    `https://lh3.googleusercontent.com/d/${driveId}`,
                    `https://drive.google.com/uc?export=view&id=${driveId}`
                ];
            }

            function formatImageUrl(rawUrl) {
                if (!rawUrl) return { primary: '', fallbacks: [] };
                const url = rawUrl.trim();

                const driveId = extractDriveId(url);
                if (driveId) {
                    const driveUrls = getDriveImageUrls(driveId);
                    return {
                        primary: driveUrls[0],
                        fallbacks: driveUrls.slice(1)
                    };
                }

                if (url.includes('dropbox.com')) {
                    return {
                        primary: url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', ''),
                        fallbacks: []
                    };
                }

                return { primary: url, fallbacks: [] };
            }

            /* ==========================================================
               3. Google Sheets Data Fetcher (JSONP + Proxy Fallbacks)
               ========================================================== */
            function fetchSheetData() {
                fetchViaJsonp()
                    .catch(() => fetchViaOpenSheet())
                    .catch(() => fetchViaAllOrigins())
                    .catch(err => console.warn('Background sync retry later:', err));
            }

            function fetchViaJsonp() {
                return new Promise((resolve, reject) => {
                    const callbackName = 'gviz_' + Math.floor(Math.random() * 1000000);
                    const script = document.createElement('script');
                    let done = false;

                    const cleanup = () => {
                        delete window[callbackName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };

                    window[callbackName] = function (res) {
                        done = true;
                        cleanup();
                        if (res && res.table && res.table.rows) {
                            const parsed = parseGviz(res.table.cols, res.table.rows);
                            if (parsed.length > 0) {
                                handleLoadedData(parsed);
                                resolve(parsed);
                                return;
                            }
                        }
                        reject(new Error("Empty response"));
                    };

                    script.onerror = () => {
                        cleanup();
                        if (!done) reject(new Error("Script load failed"));
                    };

                    setTimeout(() => {
                        if (!done) {
                            cleanup();
                            reject(new Error("Timeout"));
                        }
                    }, 8000);

                    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&_t=${Date.now()}`;
                    document.body.appendChild(script);
                });
            }

            async function fetchViaOpenSheet() {
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/1`);
                if (!res.ok) throw new Error("OpenSheet error");
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error("No rows");

                const results = [];
                data.forEach(row => {
                    for (const [key, val] of Object.entries(row)) {
                        const k = key.toLowerCase();
                        if (k.includes('image') || k.includes('img') || k.includes('photo') || k.includes('link')) {
                            const imgStr = String(val || '').trim();
                            if (imgStr) {
                                const formatted = formatImageUrl(imgStr);
                                results.push({
                                    raw: imgStr,
                                    primary: formatted.primary,
                                    fallbacks: formatted.fallbacks
                                });
                            }
                        }
                    }
                });

                if (results.length > 0) {
                    handleLoadedData(results);
                    return results;
                }
                throw new Error("No images found");
            }

            async function fetchViaAllOrigins() {
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_t=${Date.now()}`;
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(csvUrl)}`);
                if (!res.ok) throw new Error("AllOrigins error");
                const csvText = await res.text();
                const lines = csvText.split(/\r?\n/).filter(l => l.trim());
                if (lines.length < 2) throw new Error("Empty CSV");

                const results = [];
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',').map(p => p.trim().replace(/^"|"$/g, ''));
                    const imgUrl = parts.find(p => p.startsWith('http'));
                    if (imgUrl) {
                        const formatted = formatImageUrl(imgUrl);
                        results.push({
                            raw: imgUrl,
                            primary: formatted.primary,
                            fallbacks: formatted.fallbacks
                        });
                    }
                }

                if (results.length > 0) {
                    handleLoadedData(results);
                    return results;
                }
                throw new Error("No images in CSV");
            }

            function parseGviz(cols, rows) {
                const results = [];
                let imgIdx = 1;

                cols.forEach((c, idx) => {
                    const l = (c.label || c.id || '').toLowerCase();
                    if (l.includes('image') || l.includes('img') || l.includes('photo') || l.includes('link')) {
                        imgIdx = idx;
                    }
                });

                rows.forEach(r => {
                    if (!r.c) return;
                    const imgVal = r.c[imgIdx] && r.c[imgIdx].v ? String(r.c[imgIdx].v).trim() : '';
                    if (imgVal && imgVal !== 'Image' && imgVal !== '') {
                        const formatted = formatImageUrl(imgVal);
                        results.push({
                            raw: imgVal,
                            primary: formatted.primary,
                            fallbacks: formatted.fallbacks
                        });
                    }
                });

                return results;
            }

            /* ==========================================================
               4. Seamless Fullscreen Rendering
               ========================================================== */
            function handleLoadedData(newItems) {
                const isDiff = JSON.stringify(items.map(i => i.primary)) !== JSON.stringify(newItems.map(i => i.primary));
                items = newItems;

                if (isDiff) {
                    renderSlides();
                    startSlideshow();
                }

                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 500);
                }
            }

            function renderSlides() {
                const oldSlides = container.querySelectorAll('.slide-item');
                oldSlides.forEach(s => s.remove());

                items.forEach((item, idx) => {
                    const slide = document.createElement('div');
                    slide.className = `slide-item ${idx === currentIndex ? 'active' : ''}`;
                    slide.id = `slide-${idx}`;

                    const img = document.createElement('img');
                    img.className = 'slide-image';
                    img.src = item.primary;
                    img.alt = '';
                    img.loading = 'eager';

                    let fallbackIdx = 0;
                    img.onerror = function () {
                        if (item.fallbacks && fallbackIdx < item.fallbacks.length) {
                            this.src = item.fallbacks[fallbackIdx++];
                        }
                    };

                    slide.appendChild(img);
                    container.appendChild(slide);
                });
            }

            function goToSlide(idx) {
                if (items.length <= 1) return;
                const prev = document.getElementById(`slide-${currentIndex}`);
                if (prev) prev.classList.remove('active');

                currentIndex = (idx + items.length) % items.length;

                const next = document.getElementById(`slide-${currentIndex}`);
                if (next) next.classList.add('active');
            }

            function startSlideshow() {
                clearInterval(slideTimer);
                if (items.length > 1) {
                    slideTimer = setInterval(() => {
                        goToSlide(currentIndex + 1);
                    }, SLIDE_INTERVAL_MS);
                }
            }

            /* ==========================================================
               5. TV Remote & Keyboard Navigation
               ========================================================== */
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
                    goToSlide(currentIndex + 1);
                    startSlideshow();
                } else if (e.key === 'ArrowLeft') {
                    goToSlide(currentIndex - 1);
                    startSlideshow();
                } else if (e.key === 'f' || e.key === 'F') {
                    if (!document.fullscreenElement) {
                        requestTvFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                } else if (e.key === 'r' || e.key === 'R') {
                    fetchSheetData();
                }
            });

            // Init
            fetchSheetData();
            setInterval(fetchSheetData, SHEET_SYNC_MS);
        })();
    </script>
</body>
</html>
