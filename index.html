<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMB - Live TV Screen Display</title>
    <link rel="shortcut icon" href="assets/images/header/favicon.svg" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            cursor: none; /* Clean TV Kiosk without cursor */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 100% Fullscreen Viewport */
        .dmb-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Slide Container */
        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            pointer-events: none;
            will-change: opacity;
        }

        .slide-item.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

        /* Edge-to-Edge Content Image */
        .slide-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Default contain for menus/banners without cutoffs */
            object-position: center;
            display: block;
        }

        .slide-image.fit-cover {
            object-fit: cover;
        }

        /* Minimal Silent Loader */
        .initial-loader {
            position: absolute;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff5722;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        .loader-text {
            margin-top: 16px;
            color: #888888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Subtle Live Sync Pulse (Top Right Corner) */
        .sync-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00e676;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 99;
            pointer-events: none;
        }

        .sync-badge.syncing {
            opacity: 0.6;
            animation: pulse-sync 0.8s ease;
        }

        @keyframes pulse-sync {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Diagnostic / Info Overlay (Press 'i' or 'd' on TV remote) */
        .diagnostics-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            z-index: 100;
            display: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .diagnostics-overlay.show {
            display: block;
        }

        .diag-title {
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="dmb-screen" id="dmbScreen">
        <!-- Initial Loader -->
        <div class="initial-loader" id="initialLoader">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderStatus">Connecting to TV Display...</div>
        </div>
    </div>

    <!-- Live Sync Activity Dot -->
    <div class="sync-badge" id="syncBadge"></div>

    <!-- Diagnostics Panel (Toggle with 'i' / 'd') -->
    <div class="diagnostics-overlay" id="diagOverlay">
        <div class="diag-title">📺 TV Screen Status</div>
        <div>Sheet ID: <span id="diagSheetId" style="color: #64b5f6;"></span></div>
        <div>Total Slides: <span id="diagTotalSlides" style="color: #81c784;">0</span></div>
        <div>Active Slide: <span id="diagActiveSlide" style="color: #ffd54f;">-</span></div>
        <div>Sync Interval: <span id="diagSyncInterval">15s</span> | Slide Time: <span id="diagSlideTime">10s</span></div>
        <div>Last Checked: <span id="diagLastSync">-</span></div>
        <div>Status: <span id="diagStatus" style="color: #00e676;">Online</span></div>
    </div>

    <script>
        (function () {
            'use strict';

            /* ==========================================================
               1. URL Parameters & Configurations
               ========================================================== */
            const urlParams = new URLSearchParams(window.location.search);
            
            // Google Sheet ID (Defaults to your ID, or overridden via ?sheet= or ?id=)
            const SHEET_ID = urlParams.get('sheet') || urlParams.get('id') || '15hQV9i8Ysgqm42zIQ79olqHTqWKFzAFyKM-BIQMedy8';
            
            // Slideshow interval per slide (Default: 10 seconds, ?time=10 or ?interval=10)
            const SLIDE_INTERVAL_MS = (parseInt(urlParams.get('time') || urlParams.get('interval'), 10) || 10) * 1000;
            
            // Google Sheet Auto-Sync interval (Default: 15 seconds, ?sync=15)
            const SHEET_SYNC_MS = Math.max(5000, (parseInt(urlParams.get('sync'), 10) || 15) * 1000);
            
            // Image Fit mode: 'contain' (default, entire image visible) or 'cover' (edge to edge fill)
            let fitCover = urlParams.get('fit') === 'cover';

            // LocalStorage cache key
            const CACHE_KEY = `dmb_slides_${SHEET_ID}`;

            let items = [];
            let currentIndex = 0;
            let slideTimer = null;
            let syncTimer = null;
            let wakeLock = null;
            let isFetching = false;
            let lastSyncTime = null;
            let diagTimeout = null;

            const container = document.getElementById('dmbScreen');
            const loader = document.getElementById('initialLoader');
            const loaderStatus = document.getElementById('loaderStatus');
            const syncBadge = document.getElementById('syncBadge');
            const diagOverlay = document.getElementById('diagOverlay');

            /* ==========================================================
               2. Auto-Fullscreen & Keep Screen Awake for 24/7 TV
               ========================================================== */
            function requestTvFullscreen() {
                const docEl = document.documentElement;
                const reqFs = docEl.requestFullscreen || 
                              docEl.webkitRequestFullscreen || 
                              docEl.mozRequestFullScreen || 
                              docEl.msRequestFullscreen;

                if (!document.fullscreenElement && !document.webkitFullscreenElement && reqFs) {
                    reqFs.call(docEl).catch(() => {});
                }
            }

            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log('WakeLock:', err);
                }
            }

            window.addEventListener('load', () => {
                requestTvFullscreen();
                requestWakeLock();
            });

            // Trigger fullscreen & wake lock on first user interaction (touch/remote)
            ['click', 'touchstart', 'keydown', 'mousedown'].forEach(evt => {
                window.addEventListener(evt, () => {
                    requestTvFullscreen();
                    requestWakeLock();
                }, { passive: true });
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                    fetchSheetData(); // Immediately re-check on waking up
                }
            });

            /* ==========================================================
               3. Robust Google Drive & Image URL Formatter
               ========================================================== */
            function extractDriveId(url) {
                if (!url) return null;
                const fileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
                if (fileMatch && fileMatch[1]) return fileMatch[1];

                const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
                if (idMatch && idMatch[1]) return idMatch[1];

                const lh3Match = url.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/i);
                if (lh3Match && lh3Match[1]) return lh3Match[1];

                const openMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/i);
                if (openMatch && openMatch[1]) return openMatch[1];

                return null;
            }

            function getDriveImageUrls(driveId) {
                return [
                    `https://lh3.googleusercontent.com/d/${driveId}=w3840`,
                    `https://drive.google.com/thumbnail?id=${driveId}&sz=w3840`,
                    `https://drive.google.com/uc?export=view&id=${driveId}`,
                    `https://drive.google.com/uc?id=${driveId}&export=download`
                ];
            }

            function formatImageUrl(rawUrl) {
                if (!rawUrl) return null;
                const url = String(rawUrl).trim();
                if (!url || url.length < 5) return null;

                const driveId = extractDriveId(url);
                if (driveId) {
                    const driveUrls = getDriveImageUrls(driveId);
                    return {
                        raw: url,
                        primary: driveUrls[0],
                        fallbacks: driveUrls.slice(1)
                    };
                }

                if (url.includes('dropbox.com')) {
                    const cleanDropbox = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
                    return {
                        raw: url,
                        primary: cleanDropbox,
                        fallbacks: []
                    };
                }

                if (url.startsWith('http://') || url.startsWith('https://')) {
                    return {
                        raw: url,
                        primary: url,
                        fallbacks: []
                    };
                }

                return null;
            }

            /* ==========================================================
               4. Universal Multi-Strategy Live Fetcher (No Caching)
               ========================================================== */
            function triggerSyncIndicator() {
                if (syncBadge) {
                    syncBadge.classList.add('syncing');
                    setTimeout(() => syncBadge.classList.remove('syncing'), 800);
                }
            }

            async function fetchSheetData() {
                if (isFetching) return;
                isFetching = true;
                triggerSyncIndicator();

                try {
                    // Try Method 1: GViz JSONP (Bypasses all CORS & super fast)
                    const parsed = await fetchViaJsonp()
                        .catch(() => fetchViaGvizDirect())
                        .catch(() => fetchViaOpenSheet())
                        .catch(() => fetchViaCsvExport())
                        .catch(() => fetchViaAllOrigins());

                    if (parsed && parsed.length > 0) {
                        lastSyncTime = new Date();
                        updateDiagnostics(true);
                        handleLoadedData(parsed);
                    } else {
                        console.warn('Sheet returned empty image list');
                        updateDiagnostics(false, 'Empty list');
                    }
                } catch (err) {
                    console.warn('Background sync error, keeping current slides:', err);
                    updateDiagnostics(false, err.message);
                } finally {
                    isFetching = false;
                }
            }

            // Strategy 1: JSONP Google Visualization API (Cache Busted)
            function fetchViaJsonp() {
                return new Promise((resolve, reject) => {
                    const callbackName = 'gviz_dmb_' + Math.floor(Math.random() * 10000000);
                    const script = document.createElement('script');
                    let finished = false;

                    const cleanup = () => {
                        delete window[callbackName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };

                    window[callbackName] = function (res) {
                        finished = true;
                        cleanup();
                        if (res && res.table && res.table.rows) {
                            const parsed = parseGvizTable(res.table);
                            if (parsed.length > 0) {
                                resolve(parsed);
                                return;
                            }
                        }
                        reject(new Error("No valid images in GViz JSONP"));
                    };

                    script.onerror = () => {
                        cleanup();
                        if (!finished) reject(new Error("GViz JSONP script load error"));
                    };

                    setTimeout(() => {
                        if (!finished) {
                            cleanup();
                            reject(new Error("GViz JSONP timeout"));
                        }
                    }, 7000);

                    // Aggressive cache bust parameters to guarantee live update
                    const cacheBust = `${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&headers=1&tq=${encodeURIComponent('select *')}&_cb=${cacheBust}`;
                    document.body.appendChild(script);
                });
            }

            // Strategy 2: Direct GViz JSON Fetch
            async function fetchViaGvizDirect() {
                const cacheBust = `${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("GViz direct fetch error");
                const text = await res.text();
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const json = JSON.parse(jsonMatch[1]);
                    if (json.table) {
                        const parsed = parseGvizTable(json.table);
                        if (parsed.length > 0) return parsed;
                    }
                }
                throw new Error("Invalid GViz JSON response");
            }

            // Strategy 3: OpenSheet API Proxy
            async function fetchViaOpenSheet() {
                const cacheBust = Date.now();
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/1?_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("OpenSheet error");
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error("Empty OpenSheet rows");

                const results = [];
                data.forEach(row => {
                    // Check every column in the row for URLs
                    for (const val of Object.values(row)) {
                        const formatted = formatImageUrl(val);
                        if (formatted) {
                            results.push(formatted);
                            break; // One image per row
                        }
                    }
                });

                if (results.length > 0) return results;
                throw new Error("No images found via OpenSheet");
            }

            // Strategy 4: Direct Google Sheet CSV Export
            async function fetchViaCsvExport() {
                const cacheBust = Date.now();
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_cb=${cacheBust}`;
                const res = await fetch(csvUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error("CSV fetch error");
                const csvText = await res.text();
                return parseCsvText(csvText);
            }

            // Strategy 5: AllOrigins Proxy
            async function fetchViaAllOrigins() {
                const cacheBust = Date.now();
                const targetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_cb=${cacheBust}`;
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}&_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("AllOrigins error");
                const csvText = await res.text();
                return parseCsvText(csvText);
            }

            /* ==========================================================
               5. Universal Parsing Helpers (Scans all columns & rows)
               ========================================================== */
            function parseGvizTable(table) {
                const results = [];
                const rows = table.rows || [];

                rows.forEach(r => {
                    if (!r || !r.c) return;
                    // Scan all cells in the row to find any valid image/drive URL
                    for (let i = 0; i < r.c.length; i++) {
                        const cell = r.c[i];
                        if (cell && cell.v) {
                            const val = String(cell.v).trim();
                            // Skip header words if present
                            if (val.toLowerCase() === 'image' || val.toLowerCase() === 'link' || val.toLowerCase() === 'url') continue;
                            const formatted = formatImageUrl(val);
                            if (formatted) {
                                results.push(formatted);
                                break; // Found image for this row
                            }
                        }
                    }
                });

                return results;
            }

            function parseCsvText(csvText) {
                const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) throw new Error("Empty CSV");

                const results = [];
                for (let i = 0; i < lines.length; i++) {
                    const parts = lines[i].split(',').map(p => p.trim().replace(/^"|"$/g, ''));
                    for (const part of parts) {
                        const formatted = formatImageUrl(part);
                        if (formatted) {
                            results.push(formatted);
                            break;
                        }
                    }
                }

                if (results.length > 0) return results;
                throw new Error("No images found in CSV");
            }

            /* ==========================================================
               6. Preload & Seamless Slide Updating (Zero Disruption)
               ========================================================== */
            function preloadImage(url) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }

            async function handleLoadedData(newItems) {
                // Check if items changed
                const currentUrls = items.map(i => i.primary).join('|');
                const newUrls = newItems.map(i => i.primary).join('|');
                const isDifferent = currentUrls !== newUrls;

                // Save to local cache for instant boot
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(newItems));
                } catch (e) {}

                if (isDifferent) {
                    console.log('Detected Sheet update! Refreshing TV display...', newItems);
                    
                    // Preload first image before swapping to prevent black flash
                    if (newItems.length > 0) {
                        await preloadImage(newItems[0].primary);
                    }

                    items = newItems;
                    renderSlides();
                    startSlideshow();
                }

                // Hide initial loader smoothly
                if (loader && loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 500);
                }

                updateDiagnostics(true);
            }

            function renderSlides() {
                // Ensure current index is valid within new items length
                if (currentIndex >= items.length || currentIndex < 0) {
                    currentIndex = 0;
                }

                // Remove existing slides
                const oldSlides = container.querySelectorAll('.slide-item');
                oldSlides.forEach(s => s.remove());

                // Create slides
                items.forEach((item, idx) => {
                    const slide = document.createElement('div');
                    slide.className = `slide-item ${idx === currentIndex ? 'active' : ''}`;
                    slide.id = `slide-${idx}`;

                    const img = document.createElement('img');
                    img.className = `slide-image ${fitCover ? 'fit-cover' : ''}`;
                    img.src = item.primary;
                    img.alt = `Slide ${idx + 1}`;
                    img.loading = 'eager';

                    let fallbackIdx = 0;
                    img.onerror = function () {
                        if (item.fallbacks && fallbackIdx < item.fallbacks.length) {
                            this.src = item.fallbacks[fallbackIdx++];
                        }
                    };

                    slide.appendChild(img);
                    container.appendChild(slide);
                });

                // Preload remaining images in background
                if (items.length > 1) {
                    for (let i = 1; i < items.length; i++) {
                        preloadImage(items[i].primary);
                    }
                }
            }

            function goToSlide(idx) {
                if (items.length <= 1) return;

                const prevSlide = document.getElementById(`slide-${currentIndex}`);
                if (prevSlide) prevSlide.classList.remove('active');

                currentIndex = (idx + items.length) % items.length;

                const nextSlide = document.getElementById(`slide-${currentIndex}`);
                if (nextSlide) nextSlide.classList.add('active');

                updateDiagnostics();
            }

            function startSlideshow() {
                clearInterval(slideTimer);
                if (items.length > 1) {
                    slideTimer = setInterval(() => {
                        goToSlide(currentIndex + 1);
                    }, SLIDE_INTERVAL_MS);
                }
            }

            /* ==========================================================
               7. Diagnostic Panel Helper
               ========================================================== */
            function updateDiagnostics(isOnline = true, note = '') {
                const dSheet = document.getElementById('diagSheetId');
                const dTotal = document.getElementById('diagTotalSlides');
                const dActive = document.getElementById('diagActiveSlide');
                const dSync = document.getElementById('diagSyncInterval');
                const dSlide = document.getElementById('diagSlideTime');
                const dLast = document.getElementById('diagLastSync');
                const dStatus = document.getElementById('diagStatus');

                if (dSheet) dSheet.textContent = SHEET_ID.substring(0, 16) + '...';
                if (dTotal) dTotal.textContent = items.length;
                if (dActive) dActive.textContent = items.length > 0 ? `${currentIndex + 1} of ${items.length}` : '-';
                if (dSync) dSync.textContent = `${SHEET_SYNC_MS / 1000}s`;
                if (dSlide) dSlide.textContent = `${SLIDE_INTERVAL_MS / 1000}s`;
                if (dLast && lastSyncTime) dLast.textContent = lastSyncTime.toLocaleTimeString();
                if (dStatus) {
                    if (isOnline) {
                        dStatus.textContent = 'Live Sync Active';
                        dStatus.style.color = '#00e676';
                    } else {
                        dStatus.textContent = 'Retrying ' + (note ? `(${note})` : '');
                        dStatus.style.color = '#ff9800';
                    }
                }
            }

            function toggleDiagnostics() {
                if (diagOverlay) {
                    diagOverlay.classList.toggle('show');
                    clearTimeout(diagTimeout);
                    if (diagOverlay.classList.contains('show')) {
                        updateDiagnostics();
                        diagTimeout = setTimeout(() => {
                            diagOverlay.classList.remove('show');
                        }, 8000);
                    }
                }
            }

            /* ==========================================================
               8. TV Remote & Keyboard Controls
               ========================================================== */
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();

                // Next Slide
                if (e.key === 'ArrowRight' || e.key === 'Enter' || key === 'n') {
                    goToSlide(currentIndex + 1);
                    startSlideshow();
                } 
                // Previous Slide
                else if (e.key === 'ArrowLeft' || key === 'p') {
                    goToSlide(currentIndex - 1);
                    startSlideshow();
                } 
                // Toggle Fullscreen
                else if (key === 'f') {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        requestTvFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                } 
                // Force Instant Sheet Sync
                else if (key === 'r') {
                    fetchSheetData();
                } 
                // Toggle Diagnostic Overlay
                else if (key === 'i' || key === 'd') {
                    toggleDiagnostics();
                } 
                // Toggle Image Fit (contain vs cover)
                else if (key === 'o' || key === 'c') {
                    fitCover = !fitCover;
                    document.querySelectorAll('.slide-image').forEach(img => {
                        img.classList.toggle('fit-cover', fitCover);
                    });
                } 
                // Pause / Resume Slideshow
                else if (e.key === ' ') {
                    if (slideTimer) {
                        clearInterval(slideTimer);
                        slideTimer = null;
                    } else {
                        startSlideshow();
                    }
                }
            });

            /* ==========================================================
               9. Bootstrapping (Cache First + Live Polling)
               ========================================================== */
            // Try loading from cache immediately so TV displays instantly without delay
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const cachedItems = JSON.parse(cached);
                    if (Array.isArray(cachedItems) && cachedItems.length > 0) {
                        items = cachedItems;
                        renderSlides();
                        startSlideshow();
                        if (loader) loader.style.display = 'none';
                    }
                }
            } catch (e) {}

            // Initial fetch from Google Sheet
            fetchSheetData();

            // Set recurring auto-sync timer (e.g. every 15 seconds)
            syncTimer = setInterval(fetchSheetData, SHEET_SYNC_MS);

            // Self-healing memory cleanup every 6 hours
            setInterval(() => {
                const scripts = document.querySelectorAll('script[src*="gviz"]');
                scripts.forEach(s => s.remove());
            }, 6 * 60 * 60 * 1000);

        })();
    </script>
</body>
</html>
