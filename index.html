<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMB - Smart Live TV Display</title>
    <link rel="shortcut icon" href="assets/images/header/favicon.svg" type="image/x-icon">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            cursor: none; /* Clean TV Kiosk display */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Fullscreen Viewport */
        .dmb-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Slide Container */
        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            pointer-events: none;
            will-change: opacity;
            overflow: hidden;
        }

        .slide-item.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

        /* ==========================================================
           HORIZONTAL (LANDSCAPE) STYLING
           ========================================================== */
        .slide-item.orientation-horizontal .ambient-bg {
            display: none;
        }

        .slide-item.orientation-horizontal .slide-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Full 16:9 TV landscape */
            object-position: center;
            display: block;
        }

        .slide-item.orientation-horizontal .slide-image.fit-cover {
            object-fit: cover;
        }

        /* ==========================================================
           VERTICAL (PORTRAIT) STYLING
           ========================================================== */
        /* Sleek modern ambient glow background behind vertical posters on TV */
        .slide-item.orientation-vertical .ambient-bg {
            position: absolute;
            inset: -40px;
            background-size: cover;
            background-position: center;
            filter: blur(35px) brightness(0.35);
            transform: scale(1.15);
            z-index: 1;
            display: block;
        }

        .slide-item.orientation-vertical .slide-image {
            position: relative;
            z-index: 2;
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
            object-position: center;
            display: block;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        }

        .slide-item.orientation-vertical .slide-image.fit-cover {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Minimal Silent Loader */
        .initial-loader {
            position: absolute;
            inset: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff5722;
            border-radius: 50%;
            animation: spin 0.8s infinite linear;
        }

        .loader-text {
            margin-top: 16px;
            color: #888888;
            font-size: 14px;
            letter-spacing: 1px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Discreet Auto-Sync Activity Indicator (Top Right Corner) */
        .sync-badge {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #00e676;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 99;
            pointer-events: none;
        }

        .sync-badge.syncing {
            opacity: 0.6;
            animation: pulse-sync 0.8s ease;
        }

        @keyframes pulse-sync {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.6); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Diagnostic / Info Overlay (Press 'i' or 'd' on remote) */
        .diagnostics-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            z-index: 100;
            display: none;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .diagnostics-overlay.show {
            display: block;
        }

        .diag-title {
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 6px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="dmb-screen" id="dmbScreen">
        <!-- Initial Loader -->
        <div class="initial-loader" id="initialLoader">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderStatus">Connecting Live Display...</div>
        </div>
    </div>

    <!-- Live Sync Activity Dot -->
    <div class="sync-badge" id="syncBadge"></div>

    <!-- Diagnostics Panel (Toggle with 'i' / 'd') -->
    <div class="diagnostics-overlay" id="diagOverlay">
        <div class="diag-title">📺 TV Screen Status</div>
        <div>Sheet ID: <span id="diagSheetId" style="color: #64b5f6;"></span></div>
        <div>Total Slides: <span id="diagTotalSlides" style="color: #81c784;">0</span></div>
        <div>Active Slide: <span id="diagActiveSlide" style="color: #ffd54f;">-</span></div>
        <div>Current Mode: <span id="diagOrientation" style="color: #ff80ab;">Horizontal</span></div>
        <div>Auto-Sync: <span id="diagSyncInterval">10s</span> | Slide Duration: <span id="diagSlideTime">10s</span></div>
        <div>Last Synced: <span id="diagLastSync">-</span></div>
        <div>Status: <span id="diagStatus" style="color: #00e676;">Live Synced</span></div>
    </div>

    <script>
        (function () {
            'use strict';

            /* ==========================================================
               1. Default Settings (No URL params required)
               ========================================================== */
            const urlParams = new URLSearchParams(window.location.search);
            
            // Default Google Sheet ID
            const SHEET_ID = urlParams.get('sheet') || urlParams.get('id') || '15hQV9i8Ysgqm42zIQ79olqHTqWKFzAFyKM-BIQMedy8';
            
            // Slide interval: 10 seconds default
            const SLIDE_INTERVAL_MS = (parseInt(urlParams.get('time') || urlParams.get('interval'), 10) || 10) * 1000;
            
            // Automatic Google Sheet Sync: 10 seconds default (automatic background polling)
            const SHEET_SYNC_MS = Math.max(5000, (parseInt(urlParams.get('sync'), 10) || 10) * 1000);
            
            // Image Fit mode: 'contain' default, or 'cover'
            let fitCover = urlParams.get('fit') === 'cover';

            // LocalStorage cache key for instant display on TV boot
            const CACHE_KEY = `dmb_slides_${SHEET_ID}`;

            let items = [];
            let currentIndex = 0;
            let slideTimer = null;
            let syncTimer = null;
            let wakeLock = null;
            let isFetching = false;
            let lastSyncTime = null;
            let diagTimeout = null;

            const container = document.getElementById('dmbScreen');
            const loader = document.getElementById('initialLoader');
            const syncBadge = document.getElementById('syncBadge');
            const diagOverlay = document.getElementById('diagOverlay');

            /* ==========================================================
               2. 24/7 TV Screen Wake Lock & Fullscreen
               ========================================================== */
            function requestTvFullscreen() {
                const docEl = document.documentElement;
                const reqFs = docEl.requestFullscreen || 
                              docEl.webkitRequestFullscreen || 
                              docEl.mozRequestFullScreen || 
                              docEl.msRequestFullscreen;

                if (!document.fullscreenElement && !document.webkitFullscreenElement && reqFs) {
                    reqFs.call(docEl).catch(() => {});
                }
            }

            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                    }
                } catch (err) {
                    console.log('WakeLock:', err);
                }
            }

            window.addEventListener('load', () => {
                requestTvFullscreen();
                requestWakeLock();
            });

            // Fullscreen & WakeLock trigger on any remote/touch click
            ['click', 'touchstart', 'keydown', 'mousedown'].forEach(evt => {
                window.addEventListener(evt, () => {
                    requestTvFullscreen();
                    requestWakeLock();
                }, { passive: true });
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                    fetchSheetData(); // Re-sync immediately on waking
                }
            });

            /* ==========================================================
               3. Google Drive & Image URL Formatter
               ========================================================== */
            function extractDriveId(url) {
                if (!url) return null;
                const fileMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i);
                if (fileMatch && fileMatch[1]) return fileMatch[1];

                const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
                if (idMatch && idMatch[1]) return idMatch[1];

                const lh3Match = url.match(/googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/i);
                if (lh3Match && lh3Match[1]) return lh3Match[1];

                const openMatch = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/i);
                if (openMatch && openMatch[1]) return openMatch[1];

                return null;
            }

            function getDriveImageUrls(driveId) {
                return [
                    `https://lh3.googleusercontent.com/d/${driveId}=w3840`,
                    `https://drive.google.com/thumbnail?id=${driveId}&sz=w3840`,
                    `https://drive.google.com/uc?export=view&id=${driveId}`,
                    `https://drive.google.com/uc?id=${driveId}&export=download`
                ];
            }

            function formatImageUrl(rawUrl) {
                if (!rawUrl) return null;
                const url = String(rawUrl).trim();
                if (!url || url.length < 5) return null;

                const driveId = extractDriveId(url);
                if (driveId) {
                    const driveUrls = getDriveImageUrls(driveId);
                    return {
                        raw: url,
                        primary: driveUrls[0],
                        fallbacks: driveUrls.slice(1)
                    };
                }

                if (url.includes('dropbox.com')) {
                    const cleanDropbox = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
                    return {
                        raw: url,
                        primary: cleanDropbox,
                        fallbacks: []
                    };
                }

                if (url.startsWith('http://') || url.startsWith('https://')) {
                    return {
                        raw: url,
                        primary: url,
                        fallbacks: []
                    };
                }

                return null;
            }

            function parseOrientationValue(val) {
                if (!val) return 'horizontal';
                const str = String(val).toLowerCase().trim();
                if (str.includes('vert') || str.includes('port') || str === 'v') {
                    return 'vertical';
                }
                return 'horizontal';
            }

            /* ==========================================================
               4. Multi-Strategy Live Fetcher (Automatic & Cache-Busted)
               ========================================================== */
            function triggerSyncIndicator() {
                if (syncBadge) {
                    syncBadge.classList.add('syncing');
                    setTimeout(() => syncBadge.classList.remove('syncing'), 800);
                }
            }

            async function fetchSheetData() {
                if (isFetching) return;
                isFetching = true;
                triggerSyncIndicator();

                try {
                    const parsed = await fetchViaJsonp()
                        .catch(() => fetchViaGvizDirect())
                        .catch(() => fetchViaOpenSheet())
                        .catch(() => fetchViaCsvExport())
                        .catch(() => fetchViaAllOrigins());

                    if (parsed && parsed.length > 0) {
                        lastSyncTime = new Date();
                        updateDiagnostics(true);
                        handleLoadedData(parsed);
                    } else {
                        updateDiagnostics(false, 'Empty list');
                    }
                } catch (err) {
                    console.warn('Sync attempt failed, keeping active slides:', err);
                    updateDiagnostics(false, err.message);
                } finally {
                    isFetching = false;
                }
            }

            // Strategy 1: Google Visualization API JSONP (Bypasses CORS entirely)
            function fetchViaJsonp() {
                return new Promise((resolve, reject) => {
                    const callbackName = 'gviz_dmb_' + Math.floor(Math.random() * 10000000);
                    const script = document.createElement('script');
                    let finished = false;

                    const cleanup = () => {
                        delete window[callbackName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };

                    window[callbackName] = function (res) {
                        finished = true;
                        cleanup();
                        if (res && res.table && res.table.rows) {
                            const parsed = parseGvizTable(res.table);
                            if (parsed.length > 0) {
                                resolve(parsed);
                                return;
                            }
                        }
                        reject(new Error("No valid data in GViz JSONP"));
                    };

                    script.onerror = () => {
                        cleanup();
                        if (!finished) reject(new Error("GViz JSONP load error"));
                    };

                    setTimeout(() => {
                        if (!finished) {
                            cleanup();
                            reject(new Error("GViz JSONP timeout"));
                        }
                    }, 7000);

                    const cacheBust = `${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&headers=1&tq=${encodeURIComponent('select *')}&_cb=${cacheBust}`;
                    document.body.appendChild(script);
                });
            }

            // Strategy 2: Direct GViz Fetch
            async function fetchViaGvizDirect() {
                const cacheBust = `${Date.now()}_${Math.floor(Math.random() * 10000)}`;
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("GViz direct fetch error");
                const text = await res.text();
                const jsonMatch = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);/);
                if (jsonMatch && jsonMatch[1]) {
                    const json = JSON.parse(jsonMatch[1]);
                    if (json.table) {
                        const parsed = parseGvizTable(json.table);
                        if (parsed.length > 0) return parsed;
                    }
                }
                throw new Error("Invalid GViz JSON response");
            }

            // Strategy 3: OpenSheet API Proxy
            async function fetchViaOpenSheet() {
                const cacheBust = Date.now();
                const res = await fetch(`https://opensheet.elk.sh/${SHEET_ID}/1?_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("OpenSheet error");
                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error("Empty OpenSheet rows");

                const results = [];
                data.forEach(row => {
                    let imgVal = '';
                    let tvVal = '';

                    for (const [key, val] of Object.entries(row)) {
                        const k = key.toLowerCase();
                        const v = String(val || '').trim();

                        if (k === 'tv' || k.includes('orient') || k.includes('mode')) {
                            tvVal = v;
                        } else if (k.includes('image') || k.includes('img') || k.includes('photo') || k.includes('link') || k.includes('url')) {
                            imgVal = v;
                        } else if (!imgVal && (v.startsWith('http') || v.includes('drive.google'))) {
                            imgVal = v;
                        }
                    }

                    const formatted = formatImageUrl(imgVal);
                    if (formatted) {
                        results.push({
                            ...formatted,
                            orientation: parseOrientationValue(tvVal)
                        });
                    }
                });

                if (results.length > 0) return results;
                throw new Error("No images found via OpenSheet");
            }

            // Strategy 4: Direct Google Sheet CSV Export
            async function fetchViaCsvExport() {
                const cacheBust = Date.now();
                const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_cb=${cacheBust}`;
                const res = await fetch(csvUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error("CSV fetch error");
                const csvText = await res.text();
                return parseCsvText(csvText);
            }

            // Strategy 5: AllOrigins Proxy Fallback
            async function fetchViaAllOrigins() {
                const cacheBust = Date.now();
                const targetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&_cb=${cacheBust}`;
                const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}&_cb=${cacheBust}`, {
                    cache: 'no-store'
                });
                if (!res.ok) throw new Error("AllOrigins error");
                const csvText = await res.text();
                return parseCsvText(csvText);
            }

            /* ==========================================================
               5. Universal Parsing for 'TV' (Horizontal/Vertical) & 'Image'
               ========================================================== */
            function parseGvizTable(table) {
                const results = [];
                const rows = table.rows || [];
                const cols = table.cols || [];

                let imgColIdx = -1;
                let tvColIdx = -1;

                cols.forEach((c, idx) => {
                    const label = (c.label || c.id || '').toLowerCase().trim();
                    if (label === 'tv' || label.includes('orient') || label.includes('mode') || label.includes('layout')) {
                        tvColIdx = idx;
                    } else if (label.includes('image') || label.includes('img') || label.includes('photo') || label.includes('link') || label.includes('url')) {
                        imgColIdx = idx;
                    }
                });

                rows.forEach(r => {
                    if (!r || !r.c) return;

                    let imgVal = '';
                    let tvVal = '';

                    if (imgColIdx !== -1 && r.c[imgColIdx]) {
                        imgVal = r.c[imgColIdx].v ? String(r.c[imgColIdx].v).trim() : '';
                    }
                    if (tvColIdx !== -1 && r.c[tvColIdx]) {
                        tvVal = r.c[tvColIdx].v ? String(r.c[tvColIdx].v).trim() : '';
                    }

                    // Fallback scan across cells if not mapped by column name
                    if (!imgVal) {
                        for (let i = 0; i < r.c.length; i++) {
                            const val = r.c[i] && r.c[i].v ? String(r.c[i].v).trim() : '';
                            if (val.startsWith('http') || val.includes('drive.google') || val.includes('lh3.google')) {
                                imgVal = val;
                                break;
                            }
                        }
                    }

                    if (!tvVal) {
                        for (let i = 0; i < r.c.length; i++) {
                            const val = r.c[i] && r.c[i].v ? String(r.c[i].v).toLowerCase().trim() : '';
                            if (val === 'vertical' || val === 'horizontal' || val === 'portrait' || val === 'landscape' || val === 'v' || val === 'h') {
                                tvVal = val;
                                break;
                            }
                        }
                    }

                    const formatted = formatImageUrl(imgVal);
                    if (formatted) {
                        results.push({
                            ...formatted,
                            orientation: parseOrientationValue(tvVal)
                        });
                    }
                });

                return results;
            }

            function parseCsvText(csvText) {
                const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                if (lines.length === 0) throw new Error("Empty CSV");

                const parseCsvLine = (line) => {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(current.trim().replace(/^"|"$/g, ''));
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    result.push(current.trim().replace(/^"|"$/g, ''));
                    return result;
                };

                const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase().trim());
                let imgColIdx = -1;
                let tvColIdx = -1;

                headers.forEach((h, idx) => {
                    if (h === 'tv' || h.includes('orient') || h.includes('mode') || h.includes('layout')) {
                        tvColIdx = idx;
                    } else if (h.includes('image') || h.includes('img') || h.includes('photo') || h.includes('link') || h.includes('url')) {
                        imgColIdx = idx;
                    }
                });

                const results = [];
                for (let i = 1; i < lines.length; i++) {
                    const row = parseCsvLine(lines[i]);
                    if (row.length === 0 || (row.length === 1 && !row[0])) continue;

                    let imgVal = imgColIdx !== -1 ? row[imgColIdx] : '';
                    let tvVal = tvColIdx !== -1 ? row[tvColIdx] : '';

                    if (!imgVal) {
                        imgVal = row.find(c => c.startsWith('http') || c.includes('drive.google') || c.includes('lh3.google')) || '';
                    }
                    if (!tvVal) {
                        tvVal = row.find(c => {
                            const lc = c.toLowerCase();
                            return lc === 'vertical' || lc === 'horizontal' || lc === 'portrait' || lc === 'landscape' || lc === 'v' || lc === 'h';
                        }) || '';
                    }

                    const formatted = formatImageUrl(imgVal);
                    if (formatted) {
                        results.push({
                            ...formatted,
                            orientation: parseOrientationValue(tvVal)
                        });
                    }
                }

                if (results.length > 0) return results;
                throw new Error("No images found in CSV");
            }

            /* ==========================================================
               6. Preload & Seamless Slide Updating (Zero Disruption)
               ========================================================== */
            function preloadImage(url) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(true);
                    img.onerror = () => resolve(false);
                    img.src = url;
                });
            }

            async function handleLoadedData(newItems) {
                // Signature check including both Image URL and TV orientation (horizontal/vertical)
                const currentSign = items.map(i => `${i.primary}::${i.orientation}`).join('|');
                const newSign = newItems.map(i => `${i.primary}::${i.orientation}`).join('|');
                const isDifferent = currentSign !== newSign;

                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(newItems));
                } catch (e) {}

                if (isDifferent) {
                    console.log('Detected Live Update from Sheet:', newItems);

                    if (newItems.length > 0) {
                        await preloadImage(newItems[0].primary);
                    }

                    items = newItems;
                    renderSlides();
                    startSlideshow();
                }

                if (loader && loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 500);
                }

                updateDiagnostics(true);
            }

            function renderSlides() {
                if (currentIndex >= items.length || currentIndex < 0) {
                    currentIndex = 0;
                }

                const oldSlides = container.querySelectorAll('.slide-item');
                oldSlides.forEach(s => s.remove());

                items.forEach((item, idx) => {
                    const slide = document.createElement('div');
                    const isVertical = item.orientation === 'vertical';
                    slide.className = `slide-item orientation-${item.orientation} ${idx === currentIndex ? 'active' : ''}`;
                    slide.id = `slide-${idx}`;

                    // Ambient blurred backdrop for vertical mode
                    const ambient = document.createElement('div');
                    ambient.className = 'ambient-bg';
                    ambient.style.backgroundImage = `url("${item.primary}")`;
                    slide.appendChild(ambient);

                    // Main Slide Image
                    const img = document.createElement('img');
                    img.className = `slide-image ${fitCover ? 'fit-cover' : ''}`;
                    img.src = item.primary;
                    img.alt = `Slide ${idx + 1}`;
                    img.loading = 'eager';

                    let fallbackIdx = 0;
                    img.onerror = function () {
                        if (item.fallbacks && fallbackIdx < item.fallbacks.length) {
                            const nextUrl = item.fallbacks[fallbackIdx++];
                            this.src = nextUrl;
                            ambient.style.backgroundImage = `url("${nextUrl}")`;
                        }
                    };

                    slide.appendChild(img);
                    container.appendChild(slide);
                });

                // Preload remaining slides in background
                if (items.length > 1) {
                    for (let i = 1; i < items.length; i++) {
                        preloadImage(items[i].primary);
                    }
                }
            }

            function goToSlide(idx) {
                if (items.length <= 1) return;

                const prevSlide = document.getElementById(`slide-${currentIndex}`);
                if (prevSlide) prevSlide.classList.remove('active');

                currentIndex = (idx + items.length) % items.length;

                const nextSlide = document.getElementById(`slide-${currentIndex}`);
                if (nextSlide) nextSlide.classList.add('active');

                updateDiagnostics();
            }

            function startSlideshow() {
                clearInterval(slideTimer);
                if (items.length > 1) {
                    slideTimer = setInterval(() => {
                        goToSlide(currentIndex + 1);
                    }, SLIDE_INTERVAL_MS);
                }
            }

            /* ==========================================================
               7. Diagnostic Panel
               ========================================================== */
            function updateDiagnostics(isOnline = true, note = '') {
                const dSheet = document.getElementById('diagSheetId');
                const dTotal = document.getElementById('diagTotalSlides');
                const dActive = document.getElementById('diagActiveSlide');
                const dOrient = document.getElementById('diagOrientation');
                const dSync = document.getElementById('diagSyncInterval');
                const dSlide = document.getElementById('diagSlideTime');
                const dLast = document.getElementById('diagLastSync');
                const dStatus = document.getElementById('diagStatus');

                const currentItem = items[currentIndex];

                if (dSheet) dSheet.textContent = SHEET_ID.substring(0, 14) + '...';
                if (dTotal) dTotal.textContent = items.length;
                if (dActive) dActive.textContent = items.length > 0 ? `${currentIndex + 1} of ${items.length}` : '-';
                if (dOrient) {
                    if (currentItem) {
                        dOrient.textContent = currentItem.orientation.toUpperCase();
                        dOrient.style.color = currentItem.orientation === 'vertical' ? '#ff80ab' : '#64b5f6';
                    }
                }
                if (dSync) dSync.textContent = `${SHEET_SYNC_MS / 1000}s (Auto)`;
                if (dSlide) dSlide.textContent = `${SLIDE_INTERVAL_MS / 1000}s`;
                if (dLast && lastSyncTime) dLast.textContent = lastSyncTime.toLocaleTimeString();
                if (dStatus) {
                    if (isOnline) {
                        dStatus.textContent = 'Live Synced';
                        dStatus.style.color = '#00e676';
                    } else {
                        dStatus.textContent = 'Retrying ' + (note ? `(${note})` : '');
                        dStatus.style.color = '#ff9800';
                    }
                }
            }

            function toggleDiagnostics() {
                if (diagOverlay) {
                    diagOverlay.classList.toggle('show');
                    clearTimeout(diagTimeout);
                    if (diagOverlay.classList.contains('show')) {
                        updateDiagnostics();
                        diagTimeout = setTimeout(() => {
                            diagOverlay.classList.remove('show');
                        }, 8000);
                    }
                }
            }

            /* ==========================================================
               8. TV Remote & Keyboard Controls
               ========================================================== */
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();

                if (e.key === 'ArrowRight' || e.key === 'Enter' || key === 'n') {
                    goToSlide(currentIndex + 1);
                    startSlideshow();
                } else if (e.key === 'ArrowLeft' || key === 'p') {
                    goToSlide(currentIndex - 1);
                    startSlideshow();
                } else if (key === 'f') {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        requestTvFullscreen();
                    } else {
                        if (document.exitFullscreen) document.exitFullscreen();
                        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    }
                } else if (key === 'r') {
                    fetchSheetData();
                } else if (key === 'i' || key === 'd') {
                    toggleDiagnostics();
                } else if (key === 'o' || key === 'c') {
                    fitCover = !fitCover;
                    document.querySelectorAll('.slide-image').forEach(img => {
                        img.classList.toggle('fit-cover', fitCover);
                    });
                } else if (e.key === ' ') {
                    if (slideTimer) {
                        clearInterval(slideTimer);
                        slideTimer = null;
                    } else {
                        startSlideshow();
                    }
                }
            });

            /* ==========================================================
               9. Start Application (Instant Cache + Automatic Live Sync)
               ========================================================== */
            // Load instantly from localStorage cache on TV power on
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const cachedItems = JSON.parse(cached);
                    if (Array.isArray(cachedItems) && cachedItems.length > 0) {
                        items = cachedItems;
                        renderSlides();
                        startSlideshow();
                        if (loader) loader.style.display = 'none';
                    }
                }
            } catch (e) {}

            // Initial fetch from Google Sheet
            fetchSheetData();

            // Recurring automatic sync every 10 seconds (no URL params needed)
            syncTimer = setInterval(fetchSheetData, SHEET_SYNC_MS);

            // Memory cleanup every 6 hours for 24/7 TV operation
            setInterval(() => {
                const scripts = document.querySelectorAll('script[src*="gviz"]');
                scripts.forEach(s => s.remove());
            }, 6 * 60 * 60 * 1000);

        })();
    </script>
</body>
</html>
